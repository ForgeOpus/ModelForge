<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07090C" />
    <meta
      name="description"
      content="ModelForge fine-tunes the right base model for the GPU you actually have — it reads your VRAM, picks a PEFT tier with the math shown, chooses data-parallel or FSDP, and streams the run."
    />
    <title>ModelForge — hardware-aware fine-tuning</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
    // Pre-paint theme: match ThemeProvider so the redesigned palette is correct
    // before React mounts. Dark is the default unless light is stored or preferred.
    try {
      var stored = localStorage.getItem("modelforge_theme");
      var theme =
        stored === "light" || stored === "dark"
          ? stored
          : window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
      document.documentElement.classList.toggle("dark", theme === "dark");
      document.documentElement.style.colorScheme = theme;
    } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
