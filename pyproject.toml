[project]
name = "ModelForge"
version = "4.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "click>=8.1",
    "huggingface-hub>=1.14.0",
    "nvidia-ml-py>=13.595.45",
    "peft>=0.19.1",
    "platformdirs>=4.9.6",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "rich>=13.0",
    "tensorboard>=2.20.0",
    "tqdm>=4.67.3",
    "transformers>=5.8.0",
    "trl>=1.4.0",
]

[project.scripts]
modelforge = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "providers*", "utilities*", "dataset_manager*", "finetuning_strategies*", "recommendation_engine*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
