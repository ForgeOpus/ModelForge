[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "modelforge-finetuning"
version = "4.0.0"
description = "Hardware-aware fine-tuning utility with browser, terminal, and notebook interfaces."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "R3tr0 M1ll3r", email = "r3tr0.m1ll3r@gmail.com"},
]
keywords = ["fine-tuning", "llm", "huggingface", "lora", "qlora", "dpo", "grpo", "peft", "transformers"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "fastapi>=0.124.0",
    "huggingface-hub>=1.14.0",
    "nvidia-ml-py>=13.595.45",
    "peft>=0.19.1",
    "platformdirs>=4.9.6",
    "psutil>=6.0",
    "pydantic>=2.13.4",
    "uvicorn>=0.38.0",
    "websockets>=13.0",
    "tensorboard>=2.20.0",
    "tqdm>=4.67.3",
    "transformers>=5.8.0",
    "trl>=1.4.0",
    "setuptools>=81.0.0",
]

[project.optional-dependencies]
cli = [
    "click>=8.1",
    "rich>=13.0",
]
notebook = []
# Liger kernels: fused Triton kernels that cut VRAM on CUDA GPUs. No CPU or
# Windows wheels, so this is opt-in and the strategies fall back when it is absent.
gpu = [
    "liger-kernel>=0.5.0",
]
dev = [
    "click>=8.1",
    "httpx>=0.28.0",
    "pytest>=9.0.3",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/ForgeOpus/ModelForge"
Documentation = "https://modelforge-finetuning.readthedocs.io"
Repository = "https://github.com/ForgeOpus/ModelForge"
Issues = "https://github.com/ForgeOpus/ModelForge/issues"
Changelog = "https://modelforge-finetuning.readthedocs.io/en/latest/getting-started/whats-new/"
Organization = "https://github.com/ForgeOpus"

[project.scripts]
modelforge = "cli.main:cli"
modelforge-nb = "notebook_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "providers*", "utilities*", "dataset_manager*", "finetuning_strategies*", "recommendation_engine*", "workflow*", "web*", "notebook_cli*"]
exclude = ["web.frontend", "web.frontend.*", "web.frontend_dist", "web.frontend_dist.*"]

[tool.setuptools]
# Frontend source is listed in MANIFEST.in so sdists can run the npm build.
# The wheel's UI files are added by setup.py after that build, not via the manifest.
include-package-data = false

[tool.setuptools.package-data]
# setup.py replaces this with the files produced by `npm ci && npm run build`.
web = ["frontend_dist/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
